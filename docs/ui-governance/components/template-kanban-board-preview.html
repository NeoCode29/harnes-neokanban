<!-- Component: Kanban Board Preview Template -->
<!-- Standards: WCAG AA, Multi-column responsive layout, Status tokens -->
<section 
  data-component="kanban-board-preview" 
  class="p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm"
  aria-label="Preview Kolom Papan Kanban"
>
  <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800/60">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">Live Kanban Columns Preview</h3>
        <p class="text-xs text-slate-400">Sinkronisasi status task real-time</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
        Strict Safe Review Gate
      </span>
    </div>
  </div>

  <div class="mt-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 kanban-columns-grid">
    <!-- Column: To Do -->
    <div class="column-todo p-4 rounded-xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-700/60 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">To Do</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-mono count-todo">0</span>
      </div>
      <div class="cards-container flex flex-col gap-2 min-h-[80px]"></div>
    </div>

    <!-- Column: In Progress -->
    <div class="column-in-progress p-4 rounded-xl bg-blue-50/40 dark:bg-blue-950/20 border border-blue-200/60 dark:border-blue-900/60 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">In Progress</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 font-mono count-in-progress">0</span>
      </div>
      <div class="cards-container flex flex-col gap-2 min-h-[80px]"></div>
    </div>

    <!-- Column: Review -->
    <div class="column-review p-4 rounded-xl bg-amber-50/40 dark:bg-amber-950/20 border border-amber-200/60 dark:border-amber-900/60 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">Review</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300 font-mono count-review">0</span>
      </div>
      <div class="cards-container flex flex-col gap-2 min-h-[80px]"></div>
    </div>

    <!-- Column: Done -->
    <div class="column-done p-4 rounded-xl bg-emerald-50/40 dark:bg-emerald-950/20 border border-emerald-200/60 dark:border-emerald-900/60 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Done</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-mono count-done">0</span>
      </div>
      <div class="cards-container flex flex-col gap-2 min-h-[80px]"></div>
    </div>
  </div>
</section>
