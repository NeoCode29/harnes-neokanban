<!-- Component: Metric Card Template -->
<!-- Standards: WCAG AA, Token-based styles, Glassmorphism -->
<article 
  data-component="metric-card" 
  class="group relative flex flex-col justify-between p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 ease-out"
  aria-label="Statistik Metrik Proyek"
>
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 group-hover:scale-105 transition-transform duration-200">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
      <div>
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 metric-title">Total Tasks</h4>
        <p class="text-xs text-slate-400 dark:text-slate-500 metric-subtitle">Sprint berjalan</p>
      </div>
    </div>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 metric-badge">
      +100%
    </span>
  </div>

  <div class="mt-4 flex items-baseline gap-2">
    <span class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-50 metric-value">0</span>
    <span class="text-xs font-medium text-slate-500 dark:text-slate-400 metric-unit">item</span>
  </div>

  <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
    <span class="metric-footer-text">Sinkron dengan NeoKanban</span>
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Live status"></span>
  </div>
</article>
