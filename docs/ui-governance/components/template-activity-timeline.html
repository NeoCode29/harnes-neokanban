<!-- Component: Activity Timeline Template -->
<!-- Standards: WCAG AA, Semantic <time> tags, Responsive layout -->
<section 
  data-component="activity-timeline" 
  class="p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm"
  aria-label="Linimasa Aktivitas Sesi"
>
  <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800/60">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">Living Handoff Timeline</h3>
        <p class="text-xs text-slate-400">Riwayat sesi terarsip harian</p>
      </div>
    </div>
    <span class="text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono">
      docs/handoffs/
    </span>
  </div>

  <div class="mt-6 flow-root">
    <ul role="list" class="-mb-8 timeline-list">
      <!-- Timeline Item Component -->
      <li class="timeline-item relative pb-8">
        <span class="absolute left-4 top-4 -ml-px h-full w-0.5 bg-slate-200 dark:bg-slate-800" aria-hidden="true"></span>
        <div class="relative flex items-start space-x-3">
          <div class="relative">
            <span class="h-8 w-8 rounded-full bg-blue-100 dark:bg-blue-900/80 flex items-center justify-center ring-4 ring-white dark:ring-slate-900 text-blue-600 dark:text-blue-300">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </span>
          </div>
          <div class="min-w-0 flex-1 pt-1.5 flex justify-between space-x-4">
            <div>
              <p class="text-xs font-semibold text-slate-800 dark:text-slate-200 session-name">
                Setup Awal Proyek
                <span class="ml-2 font-mono text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 branch-tag">master</span>
              </p>
              <p class="mt-1 text-xs text-slate-500 dark:text-slate-400 activity-summary">
                Inisialisasi wizard kanban, healthcheck ping test, dan mapping role kolaborator @kresna.
              </p>
            </div>
            <div class="text-right text-xs whitespace-nowrap text-slate-400 dark:text-slate-500">
              <time datetime="2026-09-28" class="activity-date">2026-09-28</time>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</section>
