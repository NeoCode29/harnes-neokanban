<!-- Component: Editorial Buttons Suite -->
<!-- Standards: WCAG AA, Token-based, Micro-interactions (150ms-200ms) -->
<div data-component="buttons-suite" class="flex flex-wrap items-center gap-3">
  <!-- Primary Solid Pill Button -->
  <button 
    type="button" 
    class="px-7 py-2.5 rounded-full bg-stone-900 text-stone-50 hover:bg-stone-800 text-xs font-semibold tracking-wide transition-transform active:scale-95 shadow-sm focus:outline-none focus:ring-2 focus:ring-stone-900 focus:ring-offset-2"
  >
    Button
  </button>

  <!-- Outlined Pill Button -->
  <button 
    type="button" 
    class="px-7 py-2.5 rounded-full bg-white dark:bg-stone-900 border border-stone-800 dark:border-stone-200 text-stone-900 dark:text-stone-100 text-xs font-semibold tracking-wide hover:bg-stone-50 dark:hover:bg-stone-800 transition-transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-stone-800 focus:ring-offset-2"
  >
    Button
  </button>

  <!-- Warm Cream Pill Button -->
  <button 
    type="button" 
    class="px-7 py-2.5 rounded-full bg-[#EFECE6] dark:bg-[#262320] text-stone-900 dark:text-stone-100 text-xs font-semibold tracking-wide hover:bg-[#E5E1D9] transition-transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-stone-400 focus:ring-offset-2"
  >
    Button
  </button>

  <!-- Circle Dropdown Action Button -->
  <button 
    type="button" 
    aria-label="More options dropdown" 
    class="w-8 h-8 rounded-full bg-[#EFECE6] dark:bg-[#262320] flex items-center justify-center text-stone-700 dark:text-stone-300 hover:scale-105 transition-transform focus:outline-none focus:ring-2 focus:ring-stone-400"
  >
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <!-- Circle Menu Button -->
  <button 
    type="button" 
    aria-label="Filter menu" 
    class="w-8 h-8 rounded-full bg-[#EFECE6] dark:bg-[#262320] flex items-center justify-center text-stone-700 dark:text-stone-300 hover:scale-105 transition-transform focus:outline-none focus:ring-2 focus:ring-stone-400"
  >
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h12M4 18h8"/>
    </svg>
  </button>

  <!-- Circle Arrow Navigation Button -->
  <button 
    type="button" 
    aria-label="Next step" 
    class="w-9 h-9 rounded-full bg-[#EFECE6] dark:bg-[#262320] flex items-center justify-center text-stone-900 dark:text-stone-100 hover:bg-stone-900 hover:text-white dark:hover:bg-white dark:hover:text-black transition-all focus:outline-none focus:ring-2 focus:ring-stone-800"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
    </svg>
  </button>
</div>
