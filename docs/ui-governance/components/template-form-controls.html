<!-- Component: Editorial Form Controls (Search & Inputs) -->
<!-- Standards: WCAG AA, Token-based, Accessible labels and focus rings -->
<div data-component="form-controls" class="space-y-3.5 max-w-md">
  <!-- Desktop Search Bar with Inline Filter Dropdown Pill -->
  <div class="relative flex items-center">
    <span class="absolute left-4 text-stone-400 pointer-events-none" aria-hidden="true">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </span>
    <input 
      type="search" 
      placeholder="Search for Desktops" 
      aria-label="Search desktops"
      class="w-full pl-11 pr-28 py-3 rounded-full border border-stone-800 dark:border-stone-300 bg-white dark:bg-stone-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-stone-900 dark:focus:ring-stone-100"
    >
    <button 
      type="button" 
      class="absolute right-2 px-3.5 py-1.5 rounded-full bg-[#EFECE6] dark:bg-[#262320] text-xs font-medium text-stone-700 dark:text-stone-200 flex items-center gap-1 hover:bg-stone-200"
    >
      <span>Budget</span>
      <svg class="w-3 h-3 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Search Bar with External Filter Button -->
  <div class="relative flex items-center">
    <span class="absolute left-4 text-stone-400 pointer-events-none" aria-hidden="true">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </span>
    <input 
      type="search" 
      placeholder="Search for Mobiles" 
      aria-label="Search mobiles"
      class="w-full pl-11 pr-14 py-3 rounded-full border border-stone-800 dark:border-stone-300 bg-white dark:bg-stone-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-stone-900 dark:focus:ring-stone-100"
    >
    <button 
      type="button" 
      aria-label="Open filter settings" 
      class="absolute right-2.5 w-7 h-7 rounded-full bg-[#EFECE6] dark:bg-[#262320] flex items-center justify-center text-stone-700 dark:text-stone-200 hover:bg-stone-200"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h6"/>
      </svg>
    </button>
  </div>

  <!-- Soft Form Select Field -->
  <div class="relative">
    <select 
      aria-label="Inquiry Topic" 
      class="w-full px-4 py-2.5 rounded-2xl bg-[#EFECE6]/70 dark:bg-[#262320]/60 text-stone-700 dark:text-stone-300 text-xs appearance-none focus:outline-none cursor-pointer"
    >
      <option value="">What is your inquiry about?</option>
      <option value="interior">Interior Styling</option>
      <option value="architecture">Architecture Consult</option>
    </select>
    <span class="absolute right-3.5 top-3 pointer-events-none text-stone-500" aria-hidden="true">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </span>
  </div>
</div>
