<!-- Component: Editorial Cell & Profile Cards -->
<!-- Standards: WCAG AA, Token-based, Micro-interaction -->
<div data-component="cell-cards" class="space-y-4 max-w-sm">
  <!-- Promotion Cell -->
  <article class="flex items-center justify-between p-3.5 rounded-2xl border border-[#EAE6DF] dark:border-[#2E2B27] bg-white dark:bg-stone-900/60 hover:bg-stone-50 dark:hover:bg-stone-800/50 transition-colors">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl border border-[#EAE6DF] dark:border-stone-700 bg-[#EFECE6]/60 dark:bg-stone-800 flex items-center justify-center text-sm" aria-hidden="true">
        🎁
      </div>
      <div>
        <h3 class="font-serif text-xs sm:text-sm font-semibold text-stone-900 dark:text-stone-100">
          T&Cs Bday Promotion
        </h3>
        <p class="text-[10px] font-mono uppercase tracking-widest text-stone-400">
          NOVEMBER 2018
        </p>
      </div>
    </div>
    <button 
      type="button" 
      aria-label="View promotion terms" 
      class="w-7 h-7 rounded-full bg-[#EFECE6] dark:bg-[#262320] flex items-center justify-center text-stone-800 dark:text-stone-200 hover:scale-110 transition-transform"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </button>
  </article>

  <!-- Jane Cooper Profile Cell with Star Rating, Gold Badge, and Price -->
  <article class="flex items-center justify-between p-3.5 rounded-2xl bg-[#EFECE6]/50 dark:bg-[#262320]/40 border border-transparent hover:border-[#EAE6DF] transition-colors">
    <div class="flex items-center gap-3">
      <div class="relative">
        <img 
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=face" 
          alt="Jane Cooper avatar" 
          class="w-10 h-10 rounded-full object-cover"
        >
        <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 px-1.5 py-0.2 rounded-full bg-amber-400 text-stone-950 font-extrabold uppercase tracking-tighter" style="font-size: 8px;">
          GOLD
        </span>
      </div>
      <div>
        <div class="flex items-center gap-0.5 text-amber-500 text-xs" aria-label="Rating 5 out of 5 stars">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
        <h4 class="text-xs font-semibold text-stone-900 dark:text-stone-100">Jane Cooper</h4>
        <p class="text-[10px] text-stone-500 dark:text-stone-400 flex items-center gap-1">
          <span>Sydney</span>
          <span>•</span>
          <span class="text-emerald-600 dark:text-emerald-400 font-medium">Available now</span>
        </p>
      </div>
    </div>
    <div class="px-2.5 py-1.5 rounded-xl bg-[#EFECE6] dark:bg-[#262320] text-center">
      <div class="text-xs font-bold font-mono text-stone-900 dark:text-stone-100">$599</div>
      <div class="text-stone-400" style="font-size: 8px;">/hr</div>
    </div>
  </article>
</div>
